<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --navy: #0349A2;
    --cyan: #08A2C0;
    --cyan-tint: #F0F8FA;
    --off-white: #F8F7FB;
    --ink: #0F172A;
    --slate: #475569;
    --slate-light: #94A3B8;
    --hairline: rgba(3, 73, 162, 0.10);
    --hairline-strong: rgba(3, 73, 162, 0.18);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .main {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 32px;
    padding: 16px 0;
    align-items: start;
  }

  .chart-area { position: relative; min-height: 500px; }

  .breadcrumb {
    margin: 0 0 10px;
    font-size: 13px;
    color: var(--slate);
    line-height: 1.5;
    min-height: 20px;
  }
  .breadcrumb-item { cursor: pointer; color: var(--cyan); }
  .breadcrumb-item:hover { text-decoration: underline; }
  .breadcrumb-current { color: var(--navy); font-weight: 700; }
  .breadcrumb-sep { margin: 0 5px; color: var(--slate-light); }

  #chart {
    width: 100%;
    aspect-ratio: 1 / 1;
    max-width: 700px;
    margin: 0 auto;
    display: block;
  }
  #chart svg { width: 100%; height: 100%; display: block; }
  #chart path { cursor: pointer; transition: opacity 0.15s; }
  #chart path:hover { opacity: 0.78; }
  #chart text {
    pointer-events: none;
    fill: white;
    font-size: 10px;
    font-weight: 600;
    text-anchor: middle;
    dominant-baseline: middle;
  }
  #chart .center-label {
    pointer-events: none;
    text-anchor: middle;
    dominant-baseline: middle;
    fill: var(--navy);
  }
  #chart .center-label.title { font-size: 13px; font-weight: 700; }
  #chart .center-label.subtitle { font-size: 10px; fill: var(--slate); }

  .reset-btn {
    display: inline-block;
    margin-bottom: 8px;
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 600;
    color: var(--navy);
    background: white;
    border: 1px solid var(--hairline-strong);
    border-radius: 5px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
  }
  .reset-btn:hover { background: var(--cyan-tint); }
  .reset-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .reset-btn:disabled:hover { background: white; }

  .info-panel {
    position: sticky;
    top: 20px;
    align-self: start;
    background: white;
    border: 1px solid var(--hairline);
    border-radius: 8px;
    padding: 18px;
    min-height: 260px;
  }
  .info-eyebrow {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--cyan);
    text-transform: uppercase;
  }
  .info-title {
    margin: 6px 0 4px;
    font-size: 18px;
    font-weight: 700;
    color: var(--navy);
    letter-spacing: -0.2px;
    line-height: 1.3;
  }
  .info-path {
    font-size: 12px;
    color: var(--slate);
    line-height: 1.5;
    margin-bottom: 12px;
  }
  .info-path .arrow { color: var(--slate-light); margin: 0 4px; }
  .info-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 12px 0;
    border-top: 1px solid var(--hairline);
  }
  .info-stat .v {
    font-size: 22px;
    font-weight: 800;
    color: var(--navy);
    line-height: 1;
  }
  .info-stat .l {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.8px;
    color: var(--slate);
    text-transform: uppercase;
    margin-top: 4px;
  }
  .info-children {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--hairline);
  }
  .info-children-title {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--slate);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .info-children-item {
    padding: 3px 0;
    border-bottom: 1px solid var(--hairline);
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    font-size: 13px;
    color: var(--ink);
    line-height: 1.5;
  }
  .info-children-item:last-child { border-bottom: 0; }
  .info-children-item:hover { color: var(--cyan); }
  .info-children-item .ch-count { font-size: 11px; color: var(--slate-light); }
  .info-empty { color: var(--slate-light); font-size: 13px; font-style: italic; }

  .legend { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 5px; }
  .legend-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 8px;
    font-size: 11px;
    font-weight: 600;
    color: var(--navy);
    background: white;
    border: 1px solid var(--hairline);
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.12s;
  }
  .legend-chip:hover { background: var(--cyan-tint); }
  .legend-chip .dot { width: 8px; height: 8px; border-radius: 50%; }

  @media (max-width: 860px) {
    .main { grid-template-columns: 1fr; }
    .info-panel { position: static; }
  }
</style>
</head>
<body>

<div class="main">

      <div class="breadcrumb" id="breadcrumb"></div>

    </div>
    <div id="chart" role="img" aria-label="Sunburst diagram of the Pipeline Bio service taxonomy"></div>
  </div>
  <aside class="info-panel" id="infoPanel"></aside>
</div>

"d":3,"s":0,"c":0,"k":[]},{"n":"Domestic Courier & Freight","d":3,"s":0,"c":0,"k":[]},{"n":"Hazardous Materials Transport (Non-GMP)","d":3,"s":2,"c":0,"k":[]},{"n":"International Freight Forwarding","d":3,"s":4,"c":0,"k":[]},{"n":"Time-Critical & Same-Day Delivery","d":3,"s":9,"c":0,"k":[]}]}]}];

const rootData = { n: "Service Taxonomy", d: 0, k: TREE_DATA };

const SIZE = 700;
const RADIUS = SIZE / 2;
let currentRoot = null;
let hierarchyRoot = null;

function nodeColour(node) {
  const ancestors = node.ancestors().reverse();
  const l1Node = ancestors.find(a => a.depth === 1);
  const baseColour = l1Node ? L1_COLORS[l1Node.data.n] || "#08A2C0" : "#08A2C0";
  const depth = node.depth;
  const c = d3.color(baseColour);
  if (!c) return baseColour;
  const lightenFactor = depth <= 1 ? 0 : (depth - 1) * 0.22;
  return c.copy({ opacity: 1 - lightenFactor * 0.05 }).brighter(lightenFactor).toString();
}

function buildHierarchy() {
  hierarchyRoot = d3.hierarchy(rootData, d => d.k);
  hierarchyRoot.sort((a, b) => d3.ascending(a.data.n, b.data.n));
  const totalDepth = hierarchyRoot.height;
  const bandH = RADIUS / Math.max(1, totalDepth);
  function layoutEqual(node, x0, x1) {
    node.x0 = x0; node.x1 = x1;
    node.y0 = (node.depth - 1) * bandH;
    node.y1 = node.depth * bandH;
    if (node.depth === 0) { node.y0 = -bandH; node.y1 = 0; }
    node.value = 1;
    if (node.children && node.children.length > 0) {
      const span = (x1 - x0) / node.children.length;
      node.children.forEach((child, i) => layoutEqual(child, x0 + i * span, x0 + (i + 1) * span));
    }
  }
  layoutEqual(hierarchyRoot, 0, 2 * Math.PI);
  hierarchyRoot.each(d => { d.x0_orig = d.x0; d.x1_orig = d.x1; d.y0_orig = d.y0; d.y1_orig = d.y1; });
  return hierarchyRoot;
}

const arc = d3.arc()
  .startAngle(d => d.x0).endAngle(d => d.x1)
  .padAngle(d => Math.min((d.x1 - d.x0) / 2, 0.0024))
  .padRadius(RADIUS / 2)
  .innerRadius(d => d.y0)
  .outerRadius(d => Math.max(d.y0, d.y1 - 1));

const chart = d3.select('#chart');
const svg = chart.append('svg')
  .attr('viewBox', `${-RADIUS} ${-RADIUS} ${SIZE} ${SIZE}`)
  .attr('preserveAspectRatio', 'xMidYMid meet');

const g = svg.append('g');
const arcGroup = g.append('g').attr('class', 'arcs');
const labelGroup = g.append('g').attr('class', 'labels');
const centerGroup = g.append('g').attr('class', 'center');

const centerCircle = centerGroup.append('circle')
  .attr('r', 0).attr('fill', 'white')
  .attr('stroke', 'rgba(3,73,162,0.18)').attr('stroke-width', 1)
  .style('cursor', 'pointer')
  .on('click', () => { if (currentRoot && currentRoot.parent) zoomTo(currentRoot.parent); });

const centerTitle = centerGroup.append('text').attr('class', 'center-label title').attr('y', -8);
const centerSubtitle = centerGroup.append('text').attr('class', 'center-label subtitle').attr('y', 10);

buildHierarchy();
currentRoot = hierarchyRoot;

function zoomTo(node, animate = true) {
  currentRoot = node;
  const focus = node;
  const x0f = focus.x0_orig, x1f = focus.x1_orig;
  const y0f = focus.y0_orig, y1f = focus.y1_orig;
  const xScale = (2 * Math.PI) / (x1f - x0f);
  const yOffset = -y0f;

  const showableNodes = hierarchyRoot.descendants().filter(d => {
    if (d.depth === 0) return false;
    const inAngle = d.x0_orig < x1f && d.x1_orig > x0f;
    const inRadius = d.y1_orig > y0f;
    return inAngle && inRadius;
  });

  showableNodes.forEach(d => {
    d.target = {
      x0: (Math.max(x0f, Math.min(x1f, d.x0_orig)) - x0f) * xScale,
      x1: (Math.max(x0f, Math.min(x1f, d.x1_orig)) - x0f) * xScale,
      y0: (d.y0_orig + yOffset) * (RADIUS / (RADIUS - y0f)),
      y1: (d.y1_orig + yOffset) * (RADIUS / (RADIUS - y0f)),
    };
    if (!d._current) d._current = { ...d.target };
  });

  const t = animate ? d3.transition().duration(600).ease(d3.easeCubicInOut) : null;

  const paths = arcGroup.selectAll('path').data(showableNodes, d => d.data.n + '|' + d.depth + '|' + (d.parent ? d.parent.data.n : ''));
  paths.exit().remove();
  const pathsEnter = paths.enter().append('path')
    .attr('fill', d => nodeColour(d))
    .attr('stroke', 'rgba(248,247,251,0.6)')
    .attr('stroke-width', 0.5)
    .style('opacity', 0)
    .on('click', (e, d) => zoomTo(d))
    .on('mouseenter', (e, d) => updateInfoPanel(d))
    .on('mouseleave', () => updateInfoPanel(currentRoot));

  const pathsMerged = pathsEnter.merge(paths);
  if (animate) {
    pathsMerged.transition(t).style('opacity', 1)
      .attrTween('d', function(d) {
        const interp = d3.interpolate(this._current, d.target);
        this._current = d.target;
        return t => arc(interp(t));
      }).attr('fill', d => nodeColour(d));
  } else {
    pathsMerged.style('opacity', 1).attr('d', d => arc(d.target)).attr('fill', d => nodeColour(d)).each(function(d) { this._current = d.target; });
  }

  // Only show labels on nodes that are at most 2 levels deeper than the focus
  // This prevents thin outer-ring wedges from getting labels when zoomed in
  const focusDepth = focus.depth;
  const labelables = showableNodes.filter(d => {
    const angle = d.target.x1 - d.target.x0;
    const radius = (d.target.y0 + d.target.y1) / 2;
    const arcLength = angle * radius;
    const bandHeight = d.target.y1 - d.target.y0;
    // Depth gate: only label nodes within 2 levels of focus
    if (d.depth > focusDepth + 2) return false;
    // Size gate: need enough physical space
    return arcLength > 40 && angle > 0.08 && bandHeight > 11;
  });

  const labels = labelGroup.selectAll('text').data(labelables, d => d.data.n + '|' + d.depth + '|' + (d.parent ? d.parent.data.n : ''));
  labels.exit().remove();
  const labelsEnter = labels.enter().append('text').style('opacity', 0);
  const labelsMerged = labelsEnter.merge(labels);

  function labelTransform(d) {
    const angle = (d.target.x0 + d.target.x1) / 2;
    const radius = (d.target.y0 + d.target.y1) / 2;
    const rotateDeg = (angle * 180 / Math.PI) - 90;
    const flip = (rotateDeg > 90 && rotateDeg < 270) ? 180 : 0;
    return `rotate(${rotateDeg}) translate(${radius},0) rotate(${flip})`;
  }

  function labelText(d) {
    const angle = d.target.x1 - d.target.x0;
    const radius = (d.target.y0 + d.target.y1) / 2;
    const bandHeight = d.target.y1 - d.target.y0;
    const arcLength = angle * radius;

    // Text is rotated so it runs radially (along the band).
    // bandHeight = how far the text can travel radially = limits text LENGTH
    // arcLength = how wide the wedge is tangentially = limits text HEIGHT (font size)
    // Font: 10px tall, ~6.5px wide per char
    // So: need arcLength >= 12 (font height with padding) and bandHeight >= char_width * nChars

    if (arcLength < 14) return '';   // wedge too narrow for even 10px font
    if (bandHeight < 20) return '';  // band too thin for even 3 chars

    // How many chars fit along the band (radial direction)
    const maxChars = Math.floor((bandHeight - 6) / 6.5);
    if (maxChars < 3) return '';

    const name = d.data.n;
    if (name.length <= maxChars) return name;
    return name.slice(0, maxChars - 1) + '\u2026';
  }

  function applyLabel(sel) {
    sel.attr('transform', labelTransform)
       .text(labelText)
       .each(function(d) {
         // After setting text, use textLength to constrain it to arc - padding
         const angle = d.target.x1 - d.target.x0;
         const radius = (d.target.y0 + d.target.y1) / 2;
         const arcLength = angle * radius;
         const available = arcLength - 8;
         const txt = this.textContent;
         if (txt && txt.length > 0) {
           // Only constrain if text would naturally overflow
           const naturalWidth = txt.length * 6.0;
           if (naturalWidth > available) {
             this.setAttribute('textLength', Math.max(10, available));
             this.setAttribute('lengthAdjust', 'spacingAndGlyphs');
           } else {
             this.removeAttribute('textLength');
             this.removeAttribute('lengthAdjust');
           }
         }
       });
  }

  if (animate) {
    labelsMerged.transition(t).style('opacity', 1)
      .attr('transform', labelTransform)
      .text(labelText);
    // Apply textLength after transition (can't do it in transition easily)
    labelsMerged.on('end', function(d) { applyLabel(d3.select(this)); });
  } else {
    labelsMerged.style('opacity', 1);
    applyLabel(labelsMerged);
  }

  if (focus === hierarchyRoot) {
    centerCircle.transition(t || d3.transition().duration(0)).attr('r', 0);
    centerTitle.text(''); centerSubtitle.text('');
  } else {
    const innerR = focus.target ? focus.target.y1 * 0.95 : 36;
    centerCircle.transition(t || d3.transition().duration(0)).attr('r', Math.max(36, innerR));
    centerTitle.text(truncate(focus.data.n, 20));
    centerSubtitle.text('Click to zoom out');
  }

  updateBreadcrumb(focus);
  updateInfoPanel(focus);
  document.getElementById('resetBtn').disabled = (focus === hierarchyRoot);
}

function truncate(s, n) { return s.length > n ? s.slice(0, n - 1) + '\u2026' : s; }

function updateBreadcrumb(focus) {
  const ancestors = focus.ancestors().reverse();
  const visible = ancestors.filter(a => a.depth > 0);
  const el = document.getElementById('breadcrumb');
  el.innerHTML = '';
  if (visible.length === 0) {
    el.innerHTML = '<span style="color:var(--slate-light);font-size:13px;">Showing all 13 L1 categories. Click any wedge to zoom in.</span>';
    return;
  }
  const home = document.createElement('span');
  home.className = 'breadcrumb-item';
  home.textContent = 'All';
  home.addEventListener('click', () => zoomTo(hierarchyRoot));
  el.appendChild(home);
  visible.forEach((a, i) => {
    const sep = document.createElement('span');
    sep.className = 'breadcrumb-sep';
    sep.textContent = '›';
    el.appendChild(sep);
    const item = document.createElement('span');
    if (i === visible.length - 1) {
      item.className = 'breadcrumb-current';
    } else {
      item.className = 'breadcrumb-item';
      item.addEventListener('click', () => zoomTo(a));
    }
    item.textContent = a.data.n;
    el.appendChild(item);
  });
}

function updateInfoPanel(node) {
  const panel = document.getElementById('infoPanel');
  if (!node || node === hierarchyRoot) {
    panel.innerHTML = `
      <div class="info-eyebrow">Overview</div>
      <h2 class="info-title">All L1 categories</h2>
      <p class="info-path">Hover over any wedge to see details. Click to zoom in.</p>
      <div class="info-stats">
        <div class="info-stat"><div class="v">13</div><div class="l">L1</div></div>
        <div class="info-stat"><div class="v">77</div><div class="l">L2</div></div>
        <div class="info-stat"><div class="v">433</div><div class="l">L3</div></div>
        <div class="info-stat"><div class="v">541</div><div class="l">L4</div></div>
      </div>
      <div class="info-children">
        <div class="info-children-title">Jump to</div>
        <div class="legend">
          ${TREE_DATA.map(r => `
            <span class="legend-chip" data-name="${escapeAttr(r.n)}">
              <span class="dot" style="background:${L1_COLORS[r.n] || '#08A2C0'}"></span>
              ${escapeHtml(r.n)}
            </span>
          `).join('')}
        </div>
      </div>
    `;
    panel.querySelectorAll('.legend-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const name = chip.getAttribute('data-name');
        const target = hierarchyRoot.descendants().find(d => d.depth === 1 && d.data.n === name);
        if (target) zoomTo(target);
      });
    });
    return;
  }

  const ancestors = node.ancestors().reverse().filter(a => a.depth > 0);
  const pathStr = ancestors.slice(0, -1).map(a => escapeHtml(a.data.n)).join('<span class="arrow">›</span>');
  const layerLabel = `Layer ${node.depth}`;
  const totalDescendants = node.descendants().length - 1;
  const directChildren = node.children ? node.children.length : 0;
  const isLeaf = !node.children || node.children.length === 0;

  let childrenHtml = '';
  if (directChildren > 0) {
    childrenHtml = `
      <div class="info-children">
        <div class="info-children-title">${directChildren} direct sub-${directChildren === 1 ? 'category' : 'categories'}</div>
        <div>
          ${node.children.slice().sort((a, b) => d3.ascending(a.data.n, b.data.n)).map(ch => {
            const childCount = (ch.children || []).length;
            return `<div class="info-children-item" data-child="${escapeAttr(ch.data.n)}">
              <span>${escapeHtml(ch.data.n)}</span>
              ${childCount > 0 ? `<span class="ch-count">${childCount}</span>` : ''}
            </div>`;
          }).join('')}
        </div>
      </div>
    `;
  } else {
    childrenHtml = `<div class="info-children"><div class="info-empty">Leaf category — no further sub-categories.</div></div>`;
  }

  const statsHtml = isLeaf ? `
    <div class="info-stats">
      <div class="info-stat"><div class="v">L${node.depth}</div><div class="l">Layer</div></div>
      <div class="info-stat"><div class="v">Leaf</div><div class="l">Type</div></div>
    </div>
  ` : `
    <div class="info-stats">
      <div class="info-stat"><div class="v">${directChildren}</div><div class="l">Direct sub-cats</div></div>
      <div class="info-stat"><div class="v">${totalDescendants}</div><div class="l">All descendants</div></div>
    </div>
  `;

  panel.innerHTML = `
    <div class="info-eyebrow">${layerLabel}</div>
    <h2 class="info-title">${escapeHtml(node.data.n)}</h2>
    <div class="info-path">${pathStr || '&nbsp;'}</div>
    ${statsHtml}
    ${childrenHtml}
  `;

  panel.querySelectorAll('.info-children-item').forEach(el => {
    el.addEventListener('click', () => {
      const childName = el.getAttribute('data-child');
      const child = node.children.find(c => c.data.n === childName);
      if (child) {
        if (child.children && child.children.length > 0) zoomTo(child);
        else updateInfoPanel(child);
      }
    });
  });
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s) { return escapeHtml(s); }

document.getElementById('resetBtn').addEventListener('click', () => zoomTo(hierarchyRoot));
document.addEventListener('keydown', e => { if (e.key === 'Escape') zoomTo(hierarchyRoot); });

zoomTo(hierarchyRoot, false);
</script>
</body>
</html>
